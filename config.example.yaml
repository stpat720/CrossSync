# CrossSync example configuration
#
# One file per node (each Unraid server). `device` identifies THIS node;
# `peers` lists the others. Addresses are typically Tailnet IPs, e.g.
#   100.64.0.2:55557
#
# Paths use the Unraid user-share form /mnt/user/<share> — raw disk paths
# (/mnt/diskN, /mnt/cache) are not used, so Unraid parity is untouched.

# TLS 1.3 + certificate-fingerprint device auth:
#   - When tls: true, each node auto-generates its identity certificate on
#     first run (meta_dir/cert.pem + key.pem).
#   - You can start with NO peers and load the web UI immediately; add peer
#     blocks below whenever you're ready. A peer whose fingerprint is empty
#     boots fine but is rejected at the TLS handshake until pinned: run
#     `crosssync fingerprint --config <this-file>` on that node and paste the
#     printed fingerprint into that peer's entry here.
#   - The device id printed by `crosssync fingerprint` should match device.id
#     here; if not, prefer the certificate-derived id.
tls: true

device:
  id: 1                     # unique per node (short device id)
  name: nas-01

meta_dir: /mnt/user/appdata/crosssync   # where per-folder indexes + TLS identity live

# Periodic FULL walk — the safety net for changes the filesystem watcher missed
# (a share that was unmounted and came back, an event queue overflow, a subtree
# added while unwatched). Scans are otherwise driven by change events, so this is
# the only routine full walk. The gap adapts to how long the walk takes (12x),
# between these bounds. A full walk of ~8k files takes ~12s on an Unraid share.
# scan:
#   full_interval: 3m       # minimum gap between full walks (default 3m)
#   full_max: 15m           # maximum gap, i.e. how stale the net may get (default 15m)
#   # How many files the index hasher reads and hashes AT THE SAME TIME.
#   # 0 (default) = one reader per CPU, which is what every release before this
#   # key did. On a node whose folder lives on ONE spinning disk that default is a
#   # seek storm: measured on a 37-core node, 37 readers produced 864 reads/s at
#   # ~126 kB each, 27.8 ms average latency, 100 % disk utilisation and only
#   # ~55-70 MB/s delivered, while the same corpus on an idle node hashed at
#   # ~156 MB/s. A SMALLER pool usually delivers MORE MB/s there. The right value
#   # depends on the disk, so it is measured, never assumed: see
#   # docs/hash-throughput.md for the 4 / 8 / 16 / 32 benchmark runbook.
#   hash_workers: 8

# How many FILES a sync round pulls at the same time over one peer connection
# (default 4, hard cap 8). Each file keeps its own block pipeline in flight, so
# this is what makes a tree of many small files cost one round trip per batch of
# K instead of one round trip per file — the limit on a high-latency link. It
# costs K x 8 block buffers of memory per peer (~8 MiB at the usual 256 KiB
# block size with the default). The peer serves blocks one at a time, so raising
# this past 8 would only queue work at its read loop.
# pull_concurrency: 4
#
# How many FOLDERS of one peer may sync at the same time (default 4, hard cap 8).
# Separate folders are separate syncs: each (peer, folder) pair gets its own
# session - its own connection and its own transfer pipeline - so a folder with
# work starts (and finishes, and reports) without waiting for another folder. The
# cap is both the concurrency ceiling AND the memory one: each session carries its
# own pull pipeline, so the ceiling is roughly this value x pull_inflight_mb
# (16 MiB by default = ~64 MiB per peer at 4, ~128 MiB at 8). Set it to 1 to
# restore the old one-folder-at-a-time behaviour; it is also live-tunable without
# a restart:
#   PUT /api/settings/sync  {"max_folder_sessions_per_peer": 2}
# No two rounds ever run on the SAME folder with one peer, whatever this is set
# to (that is what keeps two writers off one deterministic .part staging temp).
# node:
#   max_folder_sessions_per_peer: 4
# --- experimental pull tuning (all ON by default; set them only to A/B test) ---
# Per-block reuse from OTHER local files: a block whose bytes already exist on
# this device (a copy, a shared prefix, a .venv tree) is copied locally instead
# of pulled, verified against the peer's hash. Set to true to turn it OFF.
# pull_disable_block_reuse: false
#
# Which pending file is pulled first: smallest (default), largest, or index
# (name order, the pre-v0.1.75 behaviour).
# pull_order: smallest
#
# Largest run of consecutive blocks asked for in one request, in KiB
# (default 4096 = 4 MiB; the protocol caps a request at 16 MiB). Larger runs =
# fewer round trips and fewer disk I/Os per byte on a FUSE share.
# pull_run_kb: 4096
#
# Response bytes one peer connection may have outstanding, in MiB (default 16).
# This, not the request count, is what bounds memory.
# pull_inflight_mb: 16

# --- permissions of files this node WRITES when it pulls ---
# 0 (default) keeps the SENDER's mode, so an executable stays executable and a
# private file stays private. Set explicit modes when the share is edited by
# other accounts over SMB: the daemon writes as its own user, so without this
# every synced file is owned (and only writable) by that user.
# pull_file_mode: 0o664
# pull_dir_mode: 0o775
#
# Give pulled files to this owner when the daemon runs as root (Unraid shares:
# typically 99:100 = nobody:users). Needs root; ignored otherwise.
# pull_uid: 99
# pull_gid: 100


# Peer connection port — pick one that is FREE on your host. 55555 is
# Resilio Sync's default port, so if you still run Resilio (e.g. during a
# migration) use a different port like 55557. Every server must use the
# same port, and each peer's `addresses` must point at it.
listen: ":55557"            # peer connection port (open on firewall/tailnet)

# REST API + SSE control plane (status/folders/events/ack/rescan/sync).
# Bind to localhost or a Tailnet IP; leave empty to disable.
control_listen: "127.0.0.1:55556"

# Optional web-UI override + self-update. The web UI is embedded in the
# binary; these two options let you update it WITHOUT rebuilding the
# container (e.g. by bind-mounting an Unraid appdata share):
#
#   ui_dir:      /mnt/user/appdata/crosssync/ui   # serve this dir's index.html if present
#   ui_update_url: https://example.com/crosssync/index.html  # newer UI to fetch
#
# With ui_dir mounted, dropping a new index.html onto the share takes
# effect immediately. The "⟳ update" button in the web UI calls
# /api/ui/update, which fetches ui_update_url, validates it, and writes it
# to ui_dir. Supported schemes: http://, https://, file://.
# ui_dir: ""
# ui_update_url: ""

# Event-history auto-archive (optional). The event log grows forever with
# routine records (transfers, skips, connectivity). When enabled, routine
# logs older than auto_archive_older_than seconds are pruned once at startup
# and then daily. OPEN attention/conflict items are NEVER auto-pruned. Leave
# disabled and use the Archive… button in the web UI for manual pruning.
# auto_archive_events: true
# auto_archive_older_than: 7776000   # seconds; 0 = default 90 days

# Daemon self-update: point update_url at a JSON release manifest (version
# + per-platform binary url + sha256) — e.g. the one published by
# ./release.sh or the CI build (a rolling nightly release):
#   https://github.com/<owner>/<repo>/releases/download/nightly/latest.json
# The daemon polls it, downloads a newer binary, verifies the checksum,
# installs it into update_dir and restarts itself. config.yaml and your
# indexes are NEVER touched. Supports http://, https:// and file:// URLs.
# Leave update_url empty to disable (default). Just fill in the URL to
# turn it on — everything below is already configured.
update_url: ""
update_dir: ""          # where the new binary installs ("" = same folder as this config)
update_auto: false      # true = apply automatically without asking; false = show a button in the web UI

# Folders are added in the web UI (Settings → Folders → "+ Add folder") and
# written back here automatically — you don't need to edit this section.
# A commented example showing every option:
#
# folders:
#   - id: h4k2m9x7w1p3z8q5      # pairing key — SAME id on every server
#     name: systems             # label shown in the UI (optional)
#     path: /mnt/user/systems   # this server's path to the share
#     conflict: conflict-copy   # conflict-copy | versioning
#     max_delete_pct: 25        # deletion guard % (0 = default 25)
#     peers: [2]                # optional: only sync with these peer ids
#     direction: send-receive   # this device only: send-receive (default) | send-only | receive-only
#     settle_scans: 2           # scans a file must stay unchanged before it syncs (1 = off)
#     settle_seconds: 10        # ...AND stay unchanged for this long (0 = default 10, -1 = window off)
#                               # this is the safety net against syncing a file mid-copy
#     delete_confirm_scans: 2   # scans a path must stay MISSING before the delete is believed
#                               # (0 = follow settle_scans, 1 = off) — protects against one bad walk
#     include: ["*.raw"]        # whitelist: only these patterns sync; empty/omitted = everything
#     ignore: ["*.tmp", ".venv/", "desktop.ini"]   # exclude patterns
#     pull_fsync: true          # fsync a pulled file before renaming it into place (DEFAULT: on when
#                               # omitted). false is a durability trade, not a tuning knob: a power
#                               # cut can then leave a file shorter than its index entry. See
#                               # docs/api.md → Pull durability.
#     versioning:
#       type: staggered         # none | trashcan | simple | staggered
#       keep: 5
#       max_age: 30
#       clean_days: 30
folders: []

# Start with no peers to boot the web UI immediately; add one block per
# other server below when ready. `id` must match that server's device.id,
# and every server must use the same `listen` port (default 55557). A peer
# with an empty fingerprint is rejected at the TLS handshake until you paste
# its `crosssync fingerprint` output here.
peers: []
#   - id: 2
#     name: nas-02
#     addresses:
#       - "100.64.0.2:55557"   # same port as the peer's `listen`
#     fingerprint: ""          # <- replace with that server's fingerprint
