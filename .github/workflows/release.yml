# Binaries are published BEFORE the manifest, in two steps, on purpose: assets go
# up as separate API calls and the release is visible while they land, so a single
# "files: dist/*" publish can expose a new latest.json next to the previous
# build's bytes. An updating daemon then reads a new manifest, downloads an old
# binary and fails with "checksum mismatch" (seen twice in production). The
# daemon-side retry (4 attempts, 2s/6s/18s) stays as the defence against CDN
# staleness on top of this ordering.

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Tests gate the publish, not just the build. A regression that compiles is
      # exactly the kind that reaches the updater otherwise: this suite caught a
      # pending counter that double-counted deletions, a rename that re-wrote every
      # byte locally, and a scanner that indexed FUSE ghost files.
      - name: Test
        run: go test ./... -count=1 -timeout 900s

      - name: Vet
        run: go vet ./...

      # Race detector on the packages that share memory. Needs cgo, which the
      # Linux runner has and the Windows dev box does not.
      - name: Race detector (concurrency-sensitive packages)
        run: CGO_ENABLED=1 go test -race -count=1 -timeout 900s ./internal/transfer/ ./internal/index/ ./internal/hold/ ./internal/watcher/ ./internal/sync/

      # Pinned, not "latest": golangci-lint has to be built with a Go that
      # understands the module's language version. "latest" resolved to a binary
      # that exited 3 (it could not analyse the Go 1.26 module) and the run showed
      # up as "Lint failed" with no findings at all.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --max-issues-per-linter=0 --max-same-issues=0

      - name: Build + update manifest
        env:
          UPDATE_BASE_URL: "https://github.com/${{ github.repository }}/releases/download/nightly"
        run: sh ./release.sh

      - name: Publish binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/crosssync-linux-amd64
            dist/crosssync-linux-arm64
            dist/crosssync-windows-amd64.exe
            dist/crosssync-darwin-arm64
            dist/crosssync-darwin-amd64
          tag_name: nightly
          name: CrossSync nightly build
          body: |
            Auto-built from ${{ github.sha }} on ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}.

            Daemons with `update_url` pointing at this release's `latest.json`
            self-update automatically (or offer it in the web UI).
          prerelease: true
          overwrite_files: true

      - name: Publish manifest (last, so it never points at missing bytes)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/latest.json
          tag_name: nightly
          prerelease: true
          overwrite_files: true
          update_release_body: false
